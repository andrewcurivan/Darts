<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livin La Vida Darts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0f0f;
      --surface: #1a1d1d;
      --surface2: #232626;
      --border: #2a3030;
      --text: #e8ebeb;
      --muted: #7a9090;
      --green: #00e676;
      --red: #ff3d57;
      --amber: #ffab00;
      --purple: #b388ff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-family: 'Bebas Neue';
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--green);
    }
    .header-text {
      flex: 1;
    }
    .team-name {
      font-family: 'Bebas Neue';
      font-size: 18px;
      letter-spacing: 1.5px;
    }
    .venue-tag {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .season-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .season-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans';
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .season-btn:hover { border-color: #3a4545; color: var(--text); }
    .season-btn.active { border-color: var(--green); color: var(--green); background: rgba(0,230,118,0.08); }
    .season-btn.locked { opacity: 0.6; }
    
    .player-picker {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      flex-wrap: wrap;
    }
    .player-chip {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .player-chip:hover { border-color: #3a4545; }
    .player-chip.active { border-color: var(--green); color: var(--green); background: rgba(0,230,118,0.08); }
    
    .tabs {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .tab {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .container.hidden { display: none; }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-family: 'Bebas Neue';
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: var(--text);
    }
    .fixture-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .fixture-info {
      flex: 1;
    }
    .fixture-opponent {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .fixture-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .fixture-availability {
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
    }
    
    .notice {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      margin: 20px 0;
    }
    
    .loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    h2 {
      font-family: 'Bebas Neue';
      font-size: 24px;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      color: var(--text);
    }
    
    button {
      font-family: 'DM Sans';
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .btn-primary {
      background: var(--green);
      color: #0d0f0f;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
    }
    .btn-primary:hover { opacity: 0.85; }
    
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-input, .form-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'DM Sans';
      font-size: 13px;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(0,230,118,0.1);
    }
    .form-select {
      cursor: pointer;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }
    
    .unlock-form {
      max-width: 300px;
      margin: 0 auto;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    
    .treasurer-badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(0,230,118,0.1);
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-logo">🎯</div>
    <div class="header-text">
      <div class="team-name">Livin La Vida Darts</div>
      <div class="venue-tag">Home: Royal British Legion · Andover</div>
    </div>
    <div class="season-switcher" id="season-switcher"></div>
  </header>

  <div class="player-picker" id="player-picker"></div>
  <div class="tabs" id="tabs"></div>

  <div class="container" id="view-loading">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading team data from Supabase...</p>
    </div>
  </div>

  <div class="container hidden" id="view-fixtures"></div>
  <div class="container hidden" id="view-dashboard"></div>
  <div class="container hidden" id="view-kitty"></div>
  <div class="container hidden" id="view-squad"></div>

  <script>
    const SUPABASE_URL = 'https://srhcogzmdbosxkvogmnj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyaGNvZ3ptZGJvc3hrdm9nbW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTA4MTYsImV4cCI6MjA5NTM4NjgxNn0.dLyVubiEg6xQDs_21ilkjObY1XigAychXls4qtdRE54';
    
    let app = {
      currentPlayer: '',
      currentSeason: '2627',
      treasurerUnlocked: false,
      players: [],
      seasons: [],
      fixtures: [],
      availability: {},
      results: {},
    };

    const TREASURER_PLAYER = 'Hayden';
    const TREASURER_PIN = '1234';

    async function apiCall(table, method = 'GET', filters = '', data = null) {
      const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
      const opts = {
        method,
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
        },
      };
      if (data) opts.body = JSON.stringify(data);
      
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
      if (method === 'DELETE') return null;
      return res.json();
    }

    async function loadAllData() {
      try {
        app.players = await apiCall('players', 'GET', '?select=*');
        app.seasons = await apiCall('seasons', 'GET', '?select=*');
        await loadSeasonData(app.currentSeason);
        renderApp();
      } catch (error) {
        const el = document.getElementById('view-loading');
        el.innerHTML = `<div style="color:var(--red);padding:20px;text-align:center">Failed to load: ${error.message}</div>`;
      }
    }

    async function loadSeasonData(seasonId) {
      app.fixtures = await apiCall('fixtures', 'GET', `?season_id=eq.${seasonId}&order=id`);
      const avail = await apiCall('availability', 'GET', '?select=*');
      app.availability = {};
      avail.forEach(a => {
        if (!app.availability[a.fixture_id]) app.availability[a.fixture_id] = {};
        app.availability[a.fixture_id][a.player_id] = a.status;
      });
      
      const singles = await apiCall('results_singles', 'GET', '?select=*');
      const doubles = await apiCall('results_doubles', 'GET', '?select=*');
      
      app.results = {};
      app.fixtures.forEach(f => {
        app.results[f.id] = {
          singles: singles.filter(s => s.fixture_id === f.id),
          doubles: doubles.filter(d => d.fixture_id === f.id),
        };
      });
    }

    function renderApp() {
      renderSeasonSwitcher();
      renderPlayerPicker();
      renderTabs();
      renderFixtures();
      renderDashboard();
      renderKitty();
      renderSquad();
    }

    function renderSeasonSwitcher() {
      const el = document.getElementById('season-switcher');
      el.innerHTML = app.seasons.map(s => `
        <button class="season-btn${s.id === app.currentSeason ? ' active' : ''}${s.locked ? ' locked' : ''}"
          onclick="switchSeason('${s.id}')">${s.label}${s.locked ? ' 🔒' : ''}</button>
      `).join('');
    }

    async function switchSeason(seasonId) {
      app.currentSeason = seasonId;
      await loadSeasonData(seasonId);
      renderApp();
    }

    function renderPlayerPicker() {
      const el = document.getElementById('player-picker');
      const active = app.players.filter(p => p.status === 'active');
      el.innerHTML = `<span style="font-size:13px;color:var(--muted);margin-right:8px">You are:</span>` +
        active.map(p => `
          <button class="player-chip${p.name === app.currentPlayer ? ' active' : ''}"
            onclick="setCurrentPlayer('${p.name}')">${p.name}</button>
        `).join('');
    }

    function setCurrentPlayer(name) {
      app.currentPlayer = name;
      renderPlayerPicker();
    }

    function renderTabs() {
      const el = document.getElementById('tabs');
      const tabs = [
        { name: 'Fixtures', id: 'fixtures' },
        { name: 'Dashboard', id: 'dashboard' },
        { name: 'Kitty', id: 'kitty' },
        { name: 'Squad', id: 'squad' },
      ];
      el.innerHTML = tabs.map((t, i) => `
        <button class="tab${i === 0 ? ' active' : ''}"
          onclick="switchTab('${t.id}', this)">${t.name}</button>
      `).join('');
    }

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
      document.getElementById(`view-${name}`).classList.remove('hidden');
    }

    function renderFixtures() {
      const el = document.getElementById('view-fixtures');
      let html = '<h2>Fixtures</h2>';
      
      if (app.treasurerUnlocked && app.currentSeason === '2627') {
        html += `<div class="card">
          <div class="card-title">➕ Add Fixture</div>
          <div class="form-group">
            <label class="form-label">Date</label>
            <input class="form-input" type="text" id="new-date" placeholder="Fri 5 Sep 2026">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Time</label>
              <input class="form-input" type="text" id="new-time" placeholder="7:30pm">
            </div>
            <div class="form-group">
              <label class="form-label">Opponent</label>
              <input class="form-input" type="text" id="new-opponent" placeholder="The Crown">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Venue</label>
              <input class="form-input" type="text" id="new-venue" placeholder="Royal British Legion">
            </div>
            <div class="form-group">
              <label class="form-label">Home / Away</label>
              <select class="form-select" id="new-home">
                <option value="true">🏠 Home</option>
                <option value="false">✈️ Away</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Competition</label>
            <select class="form-select" id="new-comp">
              <option>League</option>
              <option>Cup R1</option>
              <option>Cup R2</option>
              <option>Plate P</option>
              <option>Plate R1</option>
              <option>Friendly</option>
            </select>
          </div>
          <button class="btn-primary" style="width:100%" onclick="addFixture()">Add Fixture</button>
        </div>`;
      }
      
      if (!app.fixtures.length) {
        html += '<div class="notice">No fixtures for this season.</div>';
        el.innerHTML = html;
        return;
      }
      
      app.fixtures.forEach(f => {
        const avail = app.availability[f.id] || {};
        const yesCount = Object.values(avail).filter(s => s === 'yes').length;
        html += `
          <div class="fixture-card">
            <div class="fixture-info">
              <div class="fixture-opponent">vs ${f.opponent}</div>
              <div class="fixture-meta">${f.date} · ${f.time || '7:30pm'} · ${f.venue || 'TBC'} · ${f.home ? '🏠 Home' : '✈️ Away'}</div>
            </div>
            <div class="fixture-availability">${yesCount} confirmed</div>
          </div>
        `;
      });
      el.innerHTML = html;
    }

    async function addFixture() {
      const date = document.getElementById('new-date')?.value;
      const time = document.getElementById('new-time')?.value;
      const opponent = document.getElementById('new-opponent')?.value;
      const venue = document.getElementById('new-venue')?.value;
      const home = document.getElementById('new-home')?.value === 'true';
      const comp = document.getElementById('new-comp')?.value;
      
      if (!date || !opponent || !venue) {
        alert('Please fill in date, opponent, and venue');
        return;
      }
      
      try {
        const newFixture = {
          season_id: app.currentSeason,
          opponent,
          date,
          time: time || '7:30pm',
          home,
          comp: comp || 'League',
          venue,
        };
        
        await apiCall('fixtures', 'POST', '', newFixture);
        
        document.getElementById('new-date').value = '';
        document.getElementById('new-time').value = '';
        document.getElementById('new-opponent').value = '';
        document.getElementById('new-venue').value = '';
        
        await loadSeasonData(app.currentSeason);
        renderFixtures();
        alert('✓ Fixture added!');
      } catch (error) {
        alert('Error adding fixture: ' + error.message);
      }
    }

    function renderDashboard() {
      const el = document.getElementById('view-dashboard');
      let html = '<h2>Dashboard</h2>';
      const played = app.fixtures.filter(f => app.results[f.id] && app.results[f.id].singles.length > 0);
      
      if (!played.length) {
        html += '<div class="notice">No results entered yet.</div>';
      } else {
        html += `<div class="card">
          <div class="card-title">Season Overview</div>
          <div style="font-size:14px;">
            <strong>${played.length}</strong> matches played<br>
            <span style="color:var(--muted);font-size:12px;">Season ${app.currentSeason}</span>
          </div>
        </div>`;
      }
      el.innerHTML = html;
    }

    function renderKitty() {
      const el = document.getElementById('view-kitty');
      let html = '<h2>💰 Kitty & Payments</h2>';
      
      if (!app.treasurerUnlocked) {
        html += `<div class="unlock-form">
          <div class="form-group">
            <label class="form-label">Treasurer PIN</label>
            <input class="form-input" type="password" id="pin-input" placeholder="••••">
          </div>
          <button class="btn-primary" style="width:100%" onclick="unlockTreasurer()">Unlock Treasurer Mode</button>
        </div>`;
      } else {
        html += `<div class="treasurer-badge">🔓 Treasurer Mode Active</div>`;
        html += '<div class="notice">Kitty data will show once payment data is added.</div>';
      }
      el.innerHTML = html;
    }

    function unlockTreasurer() {
      const pin = document.getElementById('pin-input').value;
      if (pin === TREASURER_PIN) {
        app.treasurerUnlocked = true;
        renderKitty();
        renderFixtures();
      } else {
        alert('Incorrect PIN');
      }
    }

    function renderSquad() {
      const el = document.getElementById('view-squad');
      let html = '<h2>Squad</h2>';
      
      if (!app.players.length) {
        html += '<div class="notice">Loading players...</div>';
      } else {
        const active = app.players.filter(p => p.status === 'active');
        html += '<div class="card"><div class="card-title">Active Squad (' + active.length + ' players)</div>';
        active.forEach(p => {
          html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
            <div style="font-weight:700;">${p.name}</div>
            <div style="font-size:12px;color:var(--muted);">${p.email || '—'}</div>
          </div>`;
        });
        html += '</div>';
      }
      
      el.innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', loadAllData);
  </script>
</body>
</html>
