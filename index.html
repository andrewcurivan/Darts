<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livin La Vida Darts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0f0f;
      --surface: #1a1d1d;
      --surface2: #232626;
      --border: #2a3030;
      --text: #e8ebeb;
      --muted: #7a9090;
      --green: #00e676;
      --red: #ff3d57;
      --amber: #ffab00;
      --purple: #b388ff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-family: 'Bebas Neue';
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--green);
    }
    .header-text {
      flex: 1;
    }
    .team-name {
      font-family: 'Bebas Neue';
      font-size: 18px;
      letter-spacing: 1.5px;
    }
    .venue-tag {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .season-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .season-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans';
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .season-btn:hover { border-color: #3a4545; color: var(--text); }
    .season-btn.active { border-color: var(--green); color: var(--green); background: rgba(0,230,118,0.08); }
    .season-btn.locked { opacity: 0.6; }
    
    .player-picker {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      flex-wrap: wrap;
    }
    .player-chip {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .player-chip:hover { border-color: #3a4545; }
    .player-chip.active { border-color: var(--green); color: var(--green); background: rgba(0,230,118,0.08); }
    
    .tabs {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .tab {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .container.hidden { display: none; }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-title {
      font-family: 'Bebas Neue';
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: var(--text);
    }
    .fixture-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .fixture-info {
      flex: 1;
    }
    .fixture-opponent {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .fixture-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .fixture-availability {
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
    }
    
    .notice {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      margin: 20px 0;
    }
    
    .loading {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-msg {
      background: rgba(255,61,87,0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px;
      border-radius: 6px;
      margin: 16px 0;
      font-size: 12px;
    }
    
    h2 {
      font-family: 'Bebas Neue';
      font-size: 24px;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      color: var(--text);
    }
    
    button {
      font-family: 'DM Sans';
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .btn-primary {
      background: var(--green);
      color: #0d0f0f;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
    }
    .btn-primary:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <div class="header-logo">🎯</div>
    <div class="header-text">
      <div class="team-name">Livin La Vida Darts</div>
      <div class="venue-tag">Home: Royal British Legion · Andover</div>
    </div>
    <div class="season-switcher" id="season-switcher"></div>
  </header>

  <div class="player-picker" id="player-picker"></div>
  <div class="tabs" id="tabs"></div>

  <div class="container" id="view-loading">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading team data from Supabase...</p>
    </div>
  </div>

  <div class="container hidden" id="view-fixtures"></div>
  <div class="container hidden" id="view-dashboard"></div>
  <div class="container hidden" id="view-kitty"></div>
  <div class="container hidden" id="view-squad"></div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // SUPABASE CONFIG
    // ═══════════════════════════════════════════════════════════
    const SUPABASE_URL = 'https://srhcogzmdbosxkvogmnj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyaGNvZ3ptZGJvc3hrdm9nbW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTA4MTYsImV4cCI6MjA5NTM4NjgxNn0.dLyVubiEg6xQDs_21ilkjObY1XigAychXls4qtdRE54';
    
    // ═══════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════
    let app = {
      currentPlayer: '',
      currentSeason: '2627',
      treasurerUnlocked: false,
      players: [],
      seasons: [],
      fixtures: [],
      availability: {},
      results: {},
    };

    const TREASURER_PLAYER = 'Hayden';
    const TREASURER_PIN = '1234';

    // ═══════════════════════════════════════════════════════════
    // API HELPERS
    // ═══════════════════════════════════════════════════════════
    async function apiCall(table, method = 'GET', filters = '', data = null) {
      const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
      const opts = {
        method,
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
        },
      };
      if (data) opts.body = JSON.stringify(data);
      
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
      if (method === 'DELETE') return null;
      return res.json();
    }

    // ═══════════════════════════════════════════════════════════
    // LOAD DATA
    // ═══════════════════════════════════════════════════════════
    async function loadAllData() {
      try {
        // Players
        app.players = await apiCall('players', 'GET', '?select=*');
        
        // Seasons
        app.seasons = await apiCall('seasons', 'GET', '?select=*');
        
        // Load current season data
        await loadSeasonData(app.currentSeason);
        
        renderApp();
      } catch (error) {
        const el = document.getElementById('view-loading');
        el.innerHTML = `<div class="error-msg">Failed to load: ${error.message}</div>`;
        console.error(error);
      }
    }

    async function loadSeasonData(seasonId) {
      // Fixtures
      app.fixtures = await apiCall('fixtures', 'GET', `?season_id=eq.${seasonId}&order=id`);
      
      // Availability
      const avail = await apiCall('availability', 'GET', '?select=*');
      app.availability = {};
      avail.forEach(a => {
        if (!app.availability[a.fixture_id]) app.availability[a.fixture_id] = {};
        app.availability[a.fixture_id][a.player_id] = a.status;
      });
      
      // Results
      const singles = await apiCall('results_singles', 'GET', '?select=*');
      const doubles = await apiCall('results_doubles', 'GET', '?select=*');
      
      app.results = {};
      app.fixtures.forEach(f => {
        app.results[f.id] = {
          singles: singles.filter(s => s.fixture_id === f.id),
          doubles: doubles.filter(d => d.fixture_id === f.id),
        };
      });
    }

    // ═══════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════
    function renderApp() {
      renderSeasonSwitcher();
      renderPlayerPicker();
      renderTabs();
      renderFixtures();
      renderDashboard();
      renderKitty();
      renderSquad();
    }

    function renderSeasonSwitcher() {
      const el = document.getElementById('season-switcher');
      el.innerHTML = app.seasons.map(s => `
        <button class="season-btn${s.id === app.currentSeason ? ' active' : ''}${s.locked ? ' locked' : ''}"
          onclick="switchSeason('${s.id}')">${s.label}${s.locked ? ' 🔒' : ''}</button>
      `).join('');
    }

    async function switchSeason(seasonId) {
      app.currentSeason = seasonId;
      await loadSeasonData(seasonId);
      renderApp();
    }

    function renderPlayerPicker() {
      const el = document.getElementById('player-picker');
      const active = app.players.filter(p => p.status === 'active');
      el.innerHTML = `<span style="font-size:13px;color:var(--muted);margin-right:8px">You are:</span>` +
        active.map(p => `
          <button class="player-chip${p.name === app.currentPlayer ? ' active' : ''}"
            onclick="setCurrentPlayer('${p.name}')">${p.name}</button>
        `).join('');
    }

    function setCurrentPlayer(name) {
      app.currentPlayer = name;
      renderPlayerPicker();
    }

    function renderTabs() {
      const el = document.getElementById('tabs');
      const tabs = [
        { name: 'Fixtures', id: 'fixtures' },
        { name: 'Dashboard', id: 'dashboard' },
        { name: 'Kitty', id: 'kitty' },
        { name: 'Squad', id: 'squad' },
      ];
      el.innerHTML = tabs.map((t, i) => `
        <button class="tab${i === 0 ? ' active' : ''}"
          onclick="switchTab('${t.id}', this)">${t.name}</button>
      `).join('');
    }

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('[id^="view-"]').forEach(v => v.classList.add('hidden'));
      document.getElementById(`view-${name}`).classList.remove('hidden');
    }

    function renderFixtures() {
      const el = document.getElementById('view-fixtures');
      if (!app.fixtures.length) {
        el.innerHTML = '<h2>Fixtures</h2><div class="notice">No fixtures for this season.</div>';
        return;
      }
      
      let html = '<h2>Fixtures</h2>';
      app.fixtures.forEach(f => {
        const avail = app.availability[f.id] || {};
        const yesCount = Object.values(avail).filter(s => s === 'yes').length;
        html += `
          <div class="fixture-card">
            <div class="fixture-info">
              <div class="fixture-opponent">vs ${f.opponent}</div>
              <div class="fixture-meta">${f.date} · ${f.time || '7:30pm'} · ${f.home ? '🏠 Home' : '✈️ Away'}</div>
            </div>
            <div class="fixture-availability">${yesCount} confirmed</div>
          </div>
        `;
      });
      el.innerHTML = html;
    }

    function renderDashboard() {
      const el = document.getElementById('view-dashboard');
      const played = app.fixtures.filter(f => app.results[f.id] && app.results[f.id].singles.length > 0);
      
      let html = '<h2>Dashboard</h2>';
      if (!played.length) {
        html += '<div class="notice">No results entered yet.</div>';
      } else {
        html += `<div class="card">
          <div class="card-title">Season Overview</div>
          <div style="font-size:14px;">
            <strong>${played.length}</strong> matches played<br>
            <span style="color:var(--muted);font-size:12px;">Season ${app.currentSeason}</span>
          </div>
        </div>`;
      }
      el.innerHTML = html;
    }

    function renderKitty() {
      const el = document.getElementById('view-kitty');
      let html = '<h2>💰 Kitty & Payments</h2>';
      
      if (!app.treasurerUnlocked) {
        html += `<div class="card">
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Enter PIN to unlock treasurer mode:</label>
            <input type="password" id="pin-input" placeholder="1234" style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);margin-bottom:8px;">
            <button class="btn-primary" onclick="unlockTreasurer()" style="width:100%">Unlock</button>
          </div>
        </div>`;
      } else {
        html += `<div style="padding:8px 12px;background:rgba(0,230,118,0.1);border:1px solid var(--green);border-radius:6px;margin-bottom:16px;color:var(--green);font-size:12px;font-weight:700">🔓 Treasurer mode active</div>`;
      }
      
      html += '<div class="notice">Kitty data will show once payment data is added.</div>';
      el.innerHTML = html;
    }

    function unlockTreasurer() {
      const pin = document.getElementById('pin-input').value;
      if (pin === TREASURER_PIN) {
        app.treasurerUnlocked = true;
        renderKitty();
      } else {
        alert('Incorrect PIN');
      }
    }

    function renderSquad() {
      const el = document.getElementById('view-squad');
      let html = '<h2>Squad</h2>';
      
      if (!app.players.length) {
        html += '<div class="notice">Loading players...</div>';
      } else {
        const active = app.players.filter(p => p.status === 'active');
        html += '<div class="card"><div class="card-title">Active Squad (' + active.length + ' players)</div>';
        active.forEach(p => {
          html += `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
            <div style="font-weight:700;">${p.name}</div>
            <div style="font-size:12px;color:var(--muted);">${p.email || '—'}</div>
          </div>`;
        });
        html += '</div>';
      }
      
      el.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', loadAllData);
  </script>
</body>
</html>
